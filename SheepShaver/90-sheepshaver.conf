# Example for SheepShaver-jit: let processes map page zero.
# Install with:
#   sudo cp 90-sheepshaver.conf /etc/sysctl.d/ && sudo sysctl --system
# This weakens a kernel hardening setting for the whole system (it makes
# kernel NULL-pointer dereference bugs easier to exploit; CPUs with
# SMEP/SMAP mitigate most of that).  Remove the file to undo.
# With SELinux enforcing, also run: setsebool -P mmap_low_allowed 1
vm.mmap_min_addr = 0
